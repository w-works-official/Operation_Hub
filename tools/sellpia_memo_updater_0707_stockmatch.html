<script id="bookmarklet-source" type="text/plain">
(function(){
  (async function StockmatchMemoUpdater0709Memo2Fix(){
    const CONFIG = {
      supabaseUrl: 'https://vgxocngpykhlkosiaeew.supabase.co',
      supabaseKey: 'sb_publishable_XVnKGJo66GZiYTq5Ivu8dA_SjBVvX0g',
      batchSize: 80,
      taskBatchSize: 50,
      popupDelay: 900,
      saveDelay: 900,
      confirmDelay: 800
    };
    const SB_URL = CONFIG.supabaseUrl;
    const SB_KEY = CONFIG.supabaseKey;
    const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
    const normal = value => String(value == null ? '' : value).replace(/\s+/g, ' ').trim();
    const targetToken = value => {
      const text = normal(value);
      const match = text.match(/\d{8,}-\d+|\d{6,}/);
      return match ? match[0] : text;
    };
    const targetTokens = value => [...new Set(
      String(value == null ? '' : value)
        .split(/[\s,;]+/)
        .map(targetToken)
        .filter(Boolean)
    )];
    const targetRangeLabel = value => {
      const targets = targetTokens(value);
      if (!targets.length) return '';
      return targets.length === 1 ? '개별 대상 1건' : '입력 대상 ' + targets.length + '건';
    };
    const today = () => new Date().toISOString().slice(0, 10);
    const $ = id => document.getElementById(id);
    const results = [];
    let stopped = false;
    let lastBuildMeta = null;
    let lastDryRunSummary = null;
    let csvMode = 'test';

    if (!/order_stockmatch\.html/i.test(location.pathname)) {
      alert('재고매칭 탭(order_stockmatch.html)에서 실행해주세요.');
      return;
    }
    if (!window.grid || !window.grid.getData) {
      alert('재고매칭 grid 객체를 찾지 못했습니다.');
      return;
    }
    if (document.getElementById('smu0707-overlay')) {
      alert('이미 실행 중입니다.');
      return;
    }

    async function dbRequest(path, options = {}) {
      const res = await fetch(SB_URL + '/rest/v1/' + path, {
        method: options.method || 'GET',
        headers: {
          apikey: SB_KEY,
          Authorization: 'Bearer ' + SB_KEY,
          'Content-Type': 'application/json',
          Range: '0-9999',
          ...(options.headers || {})
        },
        body: options.body === undefined ? undefined : JSON.stringify(options.body)
      });
      if (!res.ok) throw new Error('DB read failed [' + path + ']: ' + await res.text());
      if (res.status === 204) return null;
      const text = await res.text();
      return text ? JSON.parse(text) : null;
    }

    async function dbRequestIn(table, column, values, select) {
      const ids = [...new Set((values || []).map(normal).filter(Boolean))];
      const out = [];
      for (let i = 0; i < ids.length; i += CONFIG.batchSize) {
        const batch = ids.slice(i, i + CONFIG.batchSize).map(encodeURIComponent).join(',');
        const rows = await dbRequest(table + '?' + column + '=in.(' + batch + ')&select=' + encodeURIComponent(select));
        out.push(...(rows || []));
      }
      return out;
    }

    async function safeDbRequestIn(table, column, values, select) {
      try {
        return await dbRequestIn(table, column, values, select);
      } catch (err) {
        console.warn('[SMU0707] optional DB read failed:', table, err);
        if (lastBuildMeta) {
          lastBuildMeta.optionalDbWarnings = lastBuildMeta.optionalDbWarnings || [];
          lastBuildMeta.optionalDbWarnings.push(table + ': ' + (err && err.message ? err.message : err));
        }
        return [];
      }
    }

    function readPageDateInput(id) {
      const el = document.getElementById(id);
      const value = el && normal(el.value);
      return /^\d{4}-\d{2}-\d{2}$/.test(value) ? value : '';
    }

    function defaultStartDate() {
      return readPageDateInput('search_date_s') || today();
    }

    function defaultEndDate() {
      const start = defaultStartDate();
      const end = readPageDateInput('search_date_e') || start;
      return end < start ? start : end;
    }

    function addDays(date, days) {
      const m = String(date || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!m) throw new Error('Invalid date: ' + date);
      const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]) + days);
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return yyyy + '-' + mm + '-' + dd;
    }

    function compactDate(date) {
      return String(date || '').replace(/-/g, '');
    }

    function dateRange(startDate, endDate) {
      const start = startDate || today();
      const end = endDate || start;
      if (end < start) throw new Error('End date is earlier than start date.');
      return { d0: compactDate(start), d1: compactDate(addDays(end, 1)), label: start + '~' + end };
    }

    function gridItems() {
      const data = window.grid.getData();
      const len = data.getLength();
      const rows = [];
      for (let i = 0; i < len; i++) rows.push({ idx: i, item: data.getItem(i) || {} });
      return rows;
    }

    async function ensureAllGridRowsLoaded() {
      const before = gridItems().length;
      const pagerEls = [...document.querySelectorAll('.slick-pager a,.slick-pager button,.slick-pager span')];
      const allBtn = pagerEls.find(el => {
        const text = normal(el.innerText || el.textContent);
        return text === '모두' || /^all$/i.test(text);
      });
      if (allBtn && !allBtn.classList.contains('ui-state-disabled')) {
        allBtn.click();
        await sleep(1000);
      }
      const after = gridItems().length;
      return { before, after, clickedAll: !!allBtn && after >= before };
    }

    function rowOrdNo(row) {
      return normal(row.c_ord_no || row.ord_no || row.order_no);
    }

    function rowInvNo(row) {
      return normal(row.c_delinum || row.inv_no || row.dnum);
    }

    function rowItemNo(row, index) {
      return normal(row.sellpia_order_item_no || row.c_order_item_no || row.c_ord_item_no || row.c_item_no || row.item_no || row.c_prv_item_no || (index + 1));
    }

    function rowItemNoStrict(row) {
      return normal(row.sellpia_order_item_no || row.c_order_item_no || row.c_ord_item_no || row.c_item_no || row.item_no);
    }

    function sourceOrderNoFromItemNo(itemNo) {
      const match = normal(itemNo).match(/^(\d{8,}-\d+)_\[\d+\]$/);
      return match ? normal(match[1]) : '';
    }

    function rowSourceOrdNo(row) {
      return sourceOrderNoFromItemNo(rowItemNoStrict(row) || normal(row?.c_prv_item_no)) || rowOrdNo(row);
    }

    function collectGridTargetsForInputs(requestedTargets, rows) {
      const targets = [];
      const matchedInputs = new Set();
      let missingOrdRows = 0;
      for (const target of requestedTargets || []) {
        const exactOrderRows = (rows || []).filter(({ item }) => rowSourceOrdNo(item) === target);
        const matchedRows = exactOrderRows.length
          ? exactOrderRows
          : (rows || []).filter(({ item }) => rowInvNo(item) === target);
        if (!matchedRows.length) continue;
        matchedInputs.add(target);
        for (const { item } of matchedRows) {
          const ordNo = rowSourceOrdNo(item);
          if (!ordNo) {
            missingOrdRows++;
            continue;
          }
          targets.push({ ordNo, invNo: rowInvNo(item) || target });
        }
      }
      return { targets, matchedInputs, missingOrdRows };
    }

    function rowsForTask(task) {
      return gridItems().filter(({ item }) => {
        const ord = rowSourceOrdNo(item);
        const inv = rowInvNo(item);
        // 주문번호가 확인된 작업은 반드시 그 주문의 상품행만 처리한다.
        // 같은 송장을 공유하는 합배송 주문까지 OR 조건으로 섞으면 각 주문 작업이
        // 송장 전체 행을 반복 처리하여 2배 실행 및 item_key_match_failed가 발생한다.
        if (task.ordNo) return ord === task.ordNo;
        return !!(task.invNo && inv === task.invNo);
      });
    }

    const DETAIL_FIELD_SELECTOR = '#dt_shop_memo,[name="dt_shop_memo"],#dt_shop_memo2,[name="dt_shop_memo2"],#dt_ord_memo,#dt_order_memo,[name="dt_ord_memo"],#dt_delirsvin_date,#dt_delirsvout_date';

    function isVisible(el) {
      return !!(el && (el.offsetParent || el.getClientRects().length));
    }

    function visibleDialogs() {
      return [...document.querySelectorAll('.ui-dialog')].filter(isVisible);
    }

    function detailReadyRoot(root) {
      if (!root) return null;
      const field = root.querySelector(DETAIL_FIELD_SELECTOR);
      return isVisible(field) ? root : null;
    }

    function rootKind(root) {
      if (!root) return 'none';
      if (root === document) return 'document';
      if (root.classList && root.classList.contains('ui-dialog')) return 'ui-dialog';
      if (root.matches && root.matches('.modal')) return 'modal';
      if (root.matches && root.matches('[role="dialog"]')) return 'role-dialog';
      return (root.tagName || 'node').toLowerCase();
    }

    function currentDetailRoot() {
      for (const root of visibleDialogs()) {
        const ready = detailReadyRoot(root);
        if (ready) return ready;
      }
      const field = document.querySelector(DETAIL_FIELD_SELECTOR);
      if (!isVisible(field)) return null;
      const dialog = field.closest('.ui-dialog,.modal,[role="dialog"]');
      if (dialog && isVisible(dialog)) return dialog;
      return field.closest('form,table') || document;
    }

    function openDialogRoot() {
      return currentDetailRoot();
    }

    async function waitForDetailReady(maxMs) {
      const deadline = perfNow() + (maxMs || CONFIG.popupDelay || 900);
      while (perfNow() < deadline) {
        const root = currentDetailRoot();
        if (root) return root;
        await sleep(80);
      }
      return currentDetailRoot();
    }

    function detailStillOpen(root) {
      if (!root) return !!currentDetailRoot();
      if (root !== document && !document.documentElement.contains(root)) return false;
      if (root !== document && !isVisible(root)) return false;
      return !!detailReadyRoot(root);
    }

    async function waitForDetailClosed(root, maxMs) {
      const deadline = perfNow() + (maxMs || 1200);
      while (perfNow() < deadline) {
        if (!detailStillOpen(root)) return true;
        await sleep(80);
      }
      return !detailStillOpen(root);
    }

    function detailCloseButton(root) {
      const local = root && root !== document && root.querySelector && root.querySelector('.ui-dialog-titlebar-close');
      if (isVisible(local)) return local;
      for (const dlg of visibleDialogs()) {
        if (!detailReadyRoot(dlg)) continue;
        const btn = dlg.querySelector('.ui-dialog-titlebar-close');
        if (isVisible(btn)) return btn;
      }
      for (const btn of [...document.querySelectorAll('.ui-dialog-titlebar-close')]) {
        if (isVisible(btn)) return btn;
      }
      return null;
    }

    async function openDetail(rowIdx) {
      window.grid.scrollRowIntoView(rowIdx);
      await sleep(180);
      window.grid.setActiveCell(rowIdx, 0);
      if (window.grid.onDblClick && window.jQuery) {
        window.grid.onDblClick.notify({ row: rowIdx, cell: 0 }, new jQuery.Event('dblclick'), window.grid);
      }
      let root = await waitForDetailReady(Math.max(CONFIG.popupDelay || 900, 1200));
      if (root) return { root, fallback: false, rootKind: rootKind(root), ready: true };
      await sleep(300);
      root = await waitForDetailReady(1800);
      return { root, fallback: true, rootKind: rootKind(root), ready: !!root };
    }

    async function closeDetail() {
      const dlg = openDialogRoot();
      if (!dlg) return { fallback: false, closed: true, rootKind: 'none', button: false };
      const btn = detailCloseButton(dlg);
      if (btn) btn.click();
      const closed = await waitForDetailClosed(dlg, 1200);
      if (closed) return { fallback: false, closed: true, rootKind: rootKind(dlg), button: !!btn };
      await sleep(300);
      return { fallback: true, closed: false, rootKind: rootKind(dlg), button: !!btn };
    }

    // A checked checkbox inside the already-open popup only proves that the
    // browser accepted the click.  Reopen the exact grid row after save so a
    // partial-hold write is never reported as successful until Sellpia serves
    // the persisted checkbox state back to us.
    async function verifyPersistedHold(rowResult) {
      const expected = plannedHoldBool(rowResult);
      const closed = await closeDetail();
      if (!closed.closed) {
        throw new Error('배송보류 저장 검증 중 상세 팝업을 닫지 못했습니다.');
      }
      await sleep(280);
      const reopened = await openDetail(rowResult.gridRowIndex);
      const root = reopened && reopened.root;
      if (!root) {
        throw new Error('배송보류 저장 검증 중 해당 셀피아 상품행을 다시 열지 못했습니다.');
      }
      try {
        assertPopupTargetMatches(root, rowResult);
        const checkbox = holdCheckbox(root);
        if (!checkbox) throw new Error('배송보류 저장 검증 중 다시 연 팝업에서 체크박스를 찾지 못했습니다.');
        const actual = !!checkbox.checked;
        if (actual !== expected) {
          throw new Error('배송보류 저장 검증 실패: 예정=' + (expected ? 'ON' : 'OFF') + ', 실제=' + (actual ? 'ON' : 'OFF'));
        }
        return { expected: expected ? 'ON' : 'OFF', actual: actual ? 'ON' : 'OFF', rootKind: rootKind(root) };
      } finally {
        await closeDetail();
      }
    }

    function fieldValue(root, selectors) {
      for (const selector of selectors) {
        const el = root && root.querySelector(selector);
        if (!el) continue;
        if ('value' in el) return normal(el.value);
        return normal(el.textContent);
      }
      return '';
    }

    function holdCheckbox(root) {
      if (!root) return null;
      const direct = root.querySelector('#dt_deli_delay,[name="dt_deli_delay"],#o_deli_delay,[name="o_deli_delay"],#deli_delay,[name="deli_delay"],input[type="checkbox"][id*="deli"][id*="delay"],input[type="checkbox"][name*="deli"][name*="delay"]');
      if (direct) return direct;
      const badLabel = /송장번호|선매칭|부분배송불가|해제일|주문메모|관리메모/;
      const siblingText = (el, dir) => {
        let node = dir === 'next' ? el.nextSibling : el.previousSibling;
        let out = '';
        for (let i = 0; node && i < 3; i++) {
          if (node.nodeType === 1 && node.matches && node.matches('input,button,select,textarea')) break;
          out += ' ' + normal(node.textContent || '');
          node = dir === 'next' ? node.nextSibling : node.previousSibling;
        }
        return normal(out);
      };
      for (const cb of [...root.querySelectorAll('input[type="checkbox"]')]) {
        const label = normal((cb.closest('label') || {}).textContent || '');
        if (/배송보류/.test(label) && !badLabel.test(label.replace(/배송보류/g, ''))) return cb;
        const next = siblingText(cb, 'next');
        if (/배송보류/.test(next) && !badLabel.test(next.replace(/배송보류/g, ''))) return cb;
      }
      let best = null;
      let bestScore = 0;
      for (const cb of [...root.querySelectorAll('input[type="checkbox"]')]) {
        const cell = normal((cb.closest('td,th,label') || {}).textContent || '');
        if (!/배송보류/.test(cell) || badLabel.test(cell.replace(/배송보류/g, ''))) continue;
        const score = cell.length <= 20 ? 100 : 60;
        if (score > bestScore) {
          best = cb;
          bestScore = score;
        }
      }
      return bestScore >= 60 ? best : null;
    }

    function plannedHoldBool(rowResult) {
      return rowResult && rowResult.plannedHold === 'ON';
    }

    function systemShippingHoldForTask(task) {
      if (!task) return 'UNKNOWN';
      if (task.systemShippingHold === 'ON' || task.systemShippingHold === 'OFF') return task.systemShippingHold;
      return 'UNKNOWN';
    }

    function normalizeScrapedShippingHoldStatus(value) {
      const text = normal(value).toUpperCase();
      if (text === 'ON') return 'ON';
      if (text === 'OFF') return 'OFF';
      if (text === 'UNKNOWN') return 'UNKNOWN';
      return '';
    }

    function normalizeSystemShippingHoldStatus(value) {
      const text = normal(value).toUpperCase();
      if (text === 'ON') return 'ON';
      if (text === 'OFF') return 'OFF';
      if (text === 'UNKNOWN') return 'UNKNOWN';
      return '';
    }

    function isDrawerOnlyMemo(value) {
      const firstLine = normal(value).split(/\r?\n/)[0] || '';
      if (!firstLine) return false;
      const chars = Array.from(firstLine.replace(/\s+/g, ''));
      if (chars.length < 3) return false;
      return /^\d{1,8}$/.test(chars.slice(2).join(''));
    }

    function scrapedShippingHoldFromOrderRows(rows) {
      const values = (rows || []).map(row => normalizeScrapedShippingHoldStatus(row?.sellpia_shipping_hold_status)).filter(Boolean);
      const rawValues = (rows || []).map(row => normal(row?.sellpia_shipping_hold_raw)).filter(Boolean);
      const scrapedAtValues = (rows || []).map(row => normal(row?.sellpia_shipping_hold_scraped_at || row?.scraped_at)).filter(Boolean).sort();
      if (values.includes('ON')) return { status: 'ON', raw: rawValues.join(' | '), scrapedAt: scrapedAtValues.pop() || '' };
      if (values.length && values.every(value => value === 'OFF')) return { status: 'OFF', raw: rawValues.join(' | '), scrapedAt: scrapedAtValues.pop() || '' };
      if (values.length) return { status: 'UNKNOWN', raw: rawValues.join(' | '), scrapedAt: scrapedAtValues.pop() || '' };
      return { status: '', raw: rawValues.join(' | '), scrapedAt: scrapedAtValues.pop() || '' };
    }

    function systemShippingHoldFromOrderRows(rows) {
      const values = (rows || []).map(row => normalizeSystemShippingHoldStatus(row?.system_shipping_hold_status)).filter(Boolean);
      const sources = (rows || []).map(row => normal(row?.system_shipping_hold_source)).filter(Boolean);
      const updatedAtValues = (rows || []).map(row => normal(row?.system_shipping_hold_updated_at)).filter(Boolean).sort();
      const uniqueValues = [...new Set(values)];
      const hasSystemValue = uniqueValues.length > 0;
      const status = uniqueValues.length === 1 ? uniqueValues[0] : 'UNKNOWN';
      return {
        status: status || 'UNKNOWN',
        known: status === 'ON' || status === 'OFF',
        source: sources[0] || (hasSystemValue ? 'system_current' : 'system_current_missing'),
        updatedAt: updatedAtValues.pop() || '',
        syncReason: status === 'ON' || status === 'OFF' ? 'orders_system_shipping_hold_status' : (hasSystemValue ? 'system_shipping_hold_review_required' : 'system_shipping_hold_status_null')
      };
    }

    function holdSyncAction(currentSellpiaHold, systemShippingHold) {
      if (systemShippingHold !== 'ON' && systemShippingHold !== 'OFF') return 'REVIEW_SKIP';
      if (currentSellpiaHold !== 'ON' && currentSellpiaHold !== 'OFF') return 'REVIEW_SKIP';
      if (currentSellpiaHold === systemShippingHold) return 'NONE';
      return systemShippingHold === 'ON' ? 'SET_ON' : 'SET_OFF';
    }

    function holdSyncReason(task, syncAction) {
      if (syncAction === 'REVIEW_SKIP') return task?.shippingHoldSyncReason || 'shipping_hold_review_required';
      if (syncAction === 'NONE') return 'system_and_sellpia_hold_match';
      if (syncAction === 'SET_ON') return task?.shippingHoldSyncReason || 'system_on_sellpia_off';
      if (syncAction === 'SET_OFF') return task?.shippingHoldSyncReason || 'system_off_sellpia_on';
      return task?.shippingHoldSyncReason || 'system_shipping_hold_current_diff';
    }

    function workflowEventTime(row) {
      return new Date(row?.event_at || row?.created_at || 0).getTime() || 0;
    }

    function workflowLocalDateKey(value) {
      if (!value) return '';
      const date = new Date(value);
      if (!Number.isFinite(date.getTime())) return '';
      const local = new Date(date.getTime() - date.getTimezoneOffset() * 60000);
      return local.toISOString().slice(0, 10);
    }

    function orderScrapeCutoffByOrdNo(orderRows) {
      const rowsByOrd = new Map();
      for (const row of orderRows || []) {
        const ord = normal(row?.ord_no || row?.order_group_no);
        if (!ord) continue;
        if (!rowsByOrd.has(ord)) rowsByOrd.set(ord, []);
        rowsByOrd.get(ord).push(row);
      }

      const cutoffs = new Map();
      for (const [ord, rows] of rowsByOrd.entries()) {
        const latestDate = [...new Set(rows.map(row => workflowLocalDateKey(row?.scraped_at)).filter(Boolean))].sort().pop();
        const latestRows = latestDate ? rows.filter(row => workflowLocalDateKey(row?.scraped_at) === latestDate) : rows;
        const times = latestRows.map(row => new Date(row?.scraped_at || 0).getTime()).filter(Number.isFinite);
        if (times.length) cutoffs.set(ord, Math.min(...times));
      }
      return cutoffs;
    }

    function buildItemKeyIndex(rows, ordNo) {
      const exact = new Map();
      const normalized = new Map();
      const addNormalized = (norm, full) => {
        if (!norm) return;
        const key = ordNo ? ordNo + '::' + norm : norm;
        if (!normalized.has(key)) normalized.set(key, new Set());
        normalized.get(key).add(full);
      };
      for (const row of rows || []) {
        for (const full of itemIdentityValues(row)) {
          exact.set(full, row);
          if (ordNo) exact.set(ordNo + '::' + full, row);
          addNormalized(normalizeItemKeyForMatch(full), full);
        }
      }
      return { exact, normalized };
    }

    function addItemAlias(target, row, ordNo, value, overwrite) {
      const val = normal(value);
      if (!val) return;
      for (const full of itemIdentityValues(row)) {
        const norm = normalizeItemKeyForMatch(full);
        [full, norm, ordNo && ordNo + '::' + full, ordNo && ordNo + '::' + norm].filter(Boolean).forEach(key => {
          if (overwrite || !target.has(key)) target.set(key, val);
        });
      }
    }

    function addItemAliasToSet(target, row, ordNo) {
      for (const full of itemIdentityValues(row)) {
        const norm = normalizeItemKeyForMatch(full);
        [full, norm, ordNo && ordNo + '::' + full, ordNo && ordNo + '::' + norm].filter(Boolean).forEach(key => target.add(key));
      }
    }

    function hasItemAlias(target, row, ordNo) {
      return itemIdentityValues(row).some(full => {
        const norm = normalizeItemKeyForMatch(full);
        return [full, norm, ordNo && ordNo + '::' + full, ordNo && ordNo + '::' + norm].filter(Boolean).some(key => target.has(key));
      });
    }

    function gridItemMatchInfo(task, row, index) {
      const original = rowItemNo(row, index);
      const strict = rowItemNoStrict(row);
      const candidates = [strict, original, normal(row.c_prv_item_no)].filter(Boolean);
      const indexMap = task.itemKeyIndex || { exact: new Map(), normalized: new Map() };
      for (const candidate of candidates) {
        const scoped = task.ordNo ? task.ordNo + '::' + candidate : candidate;
        if (indexMap.exact.has(scoped) || indexMap.exact.has(candidate)) {
          return {
            original,
            matchKey: candidate,
            method: scoped === candidate ? 'exact' : 'exact_order_scoped',
            failed: false,
          };
        }
      }
      for (const candidate of candidates) {
        const matchKey = normalizeItemKeyForMatch(candidate);
        const scoped = task.ordNo ? task.ordNo + '::' + matchKey : matchKey;
        const fulls = indexMap.normalized.get(scoped) || indexMap.normalized.get(matchKey);
        if (fulls && fulls.size === 1) {
          return {
            original,
            matchKey,
            method: 'prefix_stripped_unique',
            failed: false,
          };
        }
        if (fulls && fulls.size > 1) {
          return {
            original,
            matchKey,
            method: 'failed',
            failed: true,
            warning: 'item_key_prefix_collision',
          };
        }
      }
      return {
        original,
        matchKey: normalizeItemKeyForMatch(original),
        method: 'failed',
        failed: true,
        warning: 'item_key_match_failed',
      };
    }

    function gridItemAliasKeys(task, row, index) {
      const match = gridItemMatchInfo(task, row, index);
      const rawKeys = [
        match.original,
        match.matchKey,
        rowItemNo(row, index),
        normal(row.c_prv_item_no),
        task.ordNo && task.ordNo + '::' + match.original,
        task.ordNo && task.ordNo + '::' + match.matchKey,

    function addOrderMemoIndexEntry(map, ambiguous, key, target) {
      if (!key || ambiguous.has(key)) return;
      const existing = map.get(key);
      if (!existing) {
        map.set(key, target);
        return;
      }
      if (existing.identity === target.identity) return;
      map.delete(key);
      ambiguous.add(key);
    }

    function hasOrderMemoWriteTarget(row) {
      return !!normal(row?.order_memo) || !!normal(row?.order_memo_updated_at);
    }

    function addOrderMemoTarget(task, row) {
      // Order memo is a per-Sellpia-order-item target. Keep exact matching
      // first, but index both DB identities because Sellpia grids can expose
      // either the regular item number or the prefixed internal item number.
      // Prefix-stripped aliases are order-scoped and may resolve only when the
      // candidate is unique. A blank target remains a real target for clears.
      const ordNo = normal(task?.ordNo || row?.ord_no);
      const sellpiaOrderItemNo = normal(row?.sellpia_order_item_no);
      const itemNo = normal(row?.item_no);
      if (!ordNo || (!sellpiaOrderItemNo && !itemNo)) return;
      const identity = ordNo + '::' + (itemNo || sellpiaOrderItemNo) + '|' + sellpiaOrderItemNo;
      const baseTarget = {
        identity,
        value: normal(row?.order_memo),
        itemNo,
        sellpiaOrderItemNo,
        requested: hasOrderMemoWriteTarget(row)
      };
      if (baseTarget.requested) task.orderMemoRequestedCount++;
      const exactEntries = [
        [sellpiaOrderItemNo, 'sellpia_order_item_no_exact'],
        [itemNo, 'item_no_exact']
      ];
      for (const [candidate, matchMethod] of exactEntries) {
        const key = candidate ? ordNo + '::' + candidate : '';
        addOrderMemoIndexEntry(task.orderMemoMap, task.orderMemoAmbiguousKeys, key, {
          ...baseTarget,
          matchMethod
        });
      }
      const normalizedCandidates = [...new Set([sellpiaOrderItemNo, itemNo]
        .map(normalizeItemKeyForMatch)
        .filter(Boolean))];
      for (const candidate of normalizedCandidates) {
        addOrderMemoIndexEntry(
          task.orderMemoNormalizedMap,
          task.orderMemoNormalizedAmbiguousKeys,
          ordNo + '::' + candidate,
          { ...baseTarget, matchMethod: 'prefix_stripped_unique' }
        );
      }
    }

    function orderMemoTargetForGridRow(task, row, index) {
      const ordNo = normal(task?.ordNo || rowOrdNo(row));
      const candidates = [...new Set([
        rowItemNoStrict(row),
        rowItemNo(row, index),
        normal(row?.c_prv_item_no)
      ].map(normal).filter(Boolean))];
      const missing = warning => ({
        found: false,
        known: false,
        value: '',
        matchMethod: 'none',
        matchedItemNo: '',
        warning
      });
      if (!ordNo || !candidates.length) return missing('order_memo_target_missing');

      const exactMatches = [];
      for (const candidate of candidates) {
        const key = ordNo + '::' + candidate;
        if (task?.orderMemoAmbiguousKeys?.has(key)) return missing('order_memo_target_ambiguous');
        const target = task?.orderMemoMap?.get(key);
        if (target) exactMatches.push({ target, candidate });
      }
      const exactIdentities = new Set(exactMatches.map(entry => entry.target.identity));
      if (exactIdentities.size > 1) return missing('order_memo_target_ambiguous');
      if (exactMatches.length) {
        const { target, candidate } = exactMatches[0];
        if (!target.requested) {
          return {
            found: false,
            known: true,
            value: '',
            matchMethod: target.matchMethod,
            matchedItemNo: candidate,
            warning: ''
          };
        }
        return {
          found: true,
          known: true,
          value: target.value,
          matchMethod: target.matchMethod,
          matchedItemNo: candidate,
          warning: ''
        };
      }

      const normalizedMatches = [];
      for (const candidate of candidates) {
        const normalized = normalizeItemKeyForMatch(candidate);
        const key = normalized ? ordNo + '::' + normalized : '';
        if (!key) continue;
        if (task?.orderMemoNormalizedAmbiguousKeys?.has(key)) return missing('order_memo_target_ambiguous');
        const target = task?.orderMemoNormalizedMap?.get(key);
        if (target) normalizedMatches.push({ target, candidate });
      }
      const normalizedIdentities = new Set(normalizedMatches.map(entry => entry.target.identity));
      if (normalizedIdentities.size > 1) return missing('order_memo_target_ambiguous');
      if (normalizedMatches.length) {
        const { target, candidate } = normalizedMatches[0];
        if (!target.requested) {
          return {
            found: false,
            known: true,
            value: '',
            matchMethod: 'prefix_stripped_unique',
            matchedItemNo: candidate,
            warning: ''
          };
        }
        return {
          found: true,
          known: true,
          value: target.value,
          matchMethod: 'prefix_stripped_unique',
          matchedItemNo: candidate,
          warning: ''
        };
      }
      return missing('order_memo_target_missing');
    }

    function managementTargetKey(ordNo, itemNo) {
      const ord = normal(ordNo), item = normal(itemNo);
      return ord && item ? ord + '::' + item : '';
    }

    // Sellpia's 출고확정일 is a product-row field.  Do not use the broader
    // memo aliases here: only ord_no + item_no, then the exact Sellpia
    // order-item number, may identify a target row.
    function buildOutboundConfirmedDateTargets(ordNo, orderItemRows) {
      const targets = new Map();
      const ambiguous = new Set();
      for (const row of orderItemRows || []) {
        const target = {
          value: normal(row.sellpia_outbound_confirmed_date),
          orderItemNo: normal(row.item_no),
          matchMethod: 'order_items_item_no'
        };
        const itemKey = managementTargetKey(ordNo, row.item_no);
        if (itemKey) addUniqueManagementTarget(targets, ambiguous, itemKey, target);
        const sellpiaItemKey = managementTargetKey(ordNo, row.sellpia_order_item_no);
        if (sellpiaItemKey) addUniqueManagementTarget(targets, ambiguous, sellpiaItemKey, {
          ...target,
          matchMethod: 'order_items_sellpia_order_item_no'
        });
      }
      return { targets, ambiguous };
    }

    function outboundConfirmedDateTargetForGridRow(task, row, index) {
      const ordNo = normal(task?.ordNo || rowOrdNo(row));
      // Keep this ordered: System item_no exact match first, Sellpia's regular
      // order-item number only when the former is unavailable.
      const candidates = [rowItemNo(row, index), rowItemNoStrict(row), normal(row.c_prv_item_no)].filter(Boolean);
      for (const itemNo of candidates) {
        const key = managementTargetKey(ordNo, itemNo);
        if (!key || task?.outboundConfirmedDateAmbiguous?.has(key)) continue;
        if (task?.outboundConfirmedDateTargets?.has(key)) {
          return { found: true, ...task.outboundConfirmedDateTargets.get(key) };
        }
      }
      return { found: false, value: '', orderItemNo: '', matchMethod: 'none' };
    }

    function addUniqueManagementTarget(index, ambiguous, key, target) {
      if (!key || ambiguous.has(key)) return;
      if (index.has(key)) {
        index.delete(key);
        ambiguous.add(key);
        return;
      }
      index.set(key, target);
    }

    function isPickingHoldOn(value) {
      if (value === true || value === 1) return true;
      return /^(1|Y|YES|ON|TRUE|CHECKED)$/i.test(normal(value));
    }

    function preferPickingRowsForInvoice(matches, invNo) {
      const rows = [...new Set(matches || [])];
      const scopedInvNo = normal(invNo);
      if (!scopedInvNo) return { rows, exactInvoicePreferred: false };
      const exactInvoiceRows = rows.filter(row => normal(row?.inv_no) === scopedInvNo);
      return exactInvoiceRows.length
        ? { rows: exactInvoiceRows, exactInvoicePreferred: true }
        : { rows, exactInvoicePreferred: false };
    }

    // Partial shipping hold is a product-row workflow value.  Map it to the
    // same exact order_items keys used elsewhere in this updater; never use
    // invoice, product code, or a first row as a fallback.
    function buildPartialHoldTargets(ordNo, invNo, orderItemRows, pickingRows) {
      const targets = new Map();
      const ambiguous = new Set();
      const byPickingItemNo = new Map();
      const stats = { matched: 0, unmatched: 0, ambiguous: 0, holdOn: 0, defaultOff: 0, exactInvoicePreferred: 0 };
      const scopedOrdNo = normal(ordNo);

      for (const pickingRow of pickingRows || []) {
        if (scopedOrdNo && normal(pickingRow.ord_no) && normal(pickingRow.ord_no) !== scopedOrdNo) continue;
        const pickingItemNo = normal(pickingRow.item_no);
        if (!pickingItemNo) continue;
        const key = managementTargetKey(scopedOrdNo, pickingItemNo);
        if (!key) continue;
        if (!byPickingItemNo.has(key)) byPickingItemNo.set(key, []);
        byPickingItemNo.get(key).push(pickingRow);
      }

      for (const orderItemRow of orderItemRows || []) {
        const lookupKeys = [...new Set([orderItemRow.item_no, orderItemRow.sellpia_order_item_no]
          .map(itemNo => managementTargetKey(scopedOrdNo, itemNo))
          .filter(Boolean))];
        const allMatches = [...new Set(lookupKeys.flatMap(key => byPickingItemNo.get(key) || []))];
        // Old scraper rows can survive with an empty inv_no beside the current
        // invoice row.  When the exact current invoice exists, it is the only
        // valid source; genuine duplicates inside that invoice stay blocked.
        const preferred = preferPickingRowsForInvoice(allMatches, invNo);
        const matches = preferred.rows;
        if (matches.length !== 1) {
          if (matches.length > 1) {
            stats.ambiguous++;
            continue;
          }
          // The picking table stores exceptional item workflow rows, so a
          // non-held sibling may have no picking row at all. Keep an exact
          // order_items-scoped OFF target for that case. holdPlanForGridRow
          // still refuses to apply OFF when the order-level state is unknown.
          const target = {
            hold: false,
            orderItemNo: normal(orderItemRow.item_no),
            pickingItemNo: '',
            matchMethod: 'picking_hold_absent_order_item_exact'
          };
          for (const key of lookupKeys) addUniqueManagementTarget(targets, ambiguous, key, target);
          stats.unmatched++;
          stats.defaultOff++;
          continue;
        }
        const pickingRow = matches[0];
        if (preferred.exactInvoicePreferred) stats.exactInvoicePreferred++;
        const target = {
          hold: isPickingHoldOn(pickingRow.hold),
          orderItemNo: normal(orderItemRow.item_no),
          pickingItemNo: normal(pickingRow.item_no),
          matchMethod: (
            normal(pickingRow.item_no) === normal(orderItemRow.item_no)
              ? 'picking_item_no_exact'
              : 'picking_sellpia_order_item_no_exact'
          ) + (preferred.exactInvoicePreferred ? '_current_invoice' : '')
        };
        for (const key of lookupKeys) addUniqueManagementTarget(targets, ambiguous, key, target);
        stats.matched++;
        if (target.hold) stats.holdOn++;
      }
      stats.ambiguous = ambiguous.size || stats.ambiguous;
      return { targets, ambiguous, stats };
    }

    function partialHoldTargetForGridRow(task, row, index) {
      const candidates = [rowItemNoStrict(row), rowItemNo(row, index), normal(row.c_prv_item_no)].filter(Boolean);
      for (const itemNo of candidates) {
        const key = managementTargetKey(task?.ordNo || rowOrdNo(row), itemNo);
        if (!key || task?.partialHoldAmbiguous?.has(key)) continue;
        if (task?.partialHoldTargets?.has(key)) return { found: true, ...task.partialHoldTargets.get(key) };
      }
      return { found: false, hold: false, orderItemNo: '', pickingItemNo: '', matchMethod: 'none' };
    }

    function holdPlanForGridRow(task, row, index, currentSellpiaHold) {
      const current = currentSellpiaHold === 'ON' || currentSellpiaHold === 'OFF' ? currentSellpiaHold : 'UNKNOWN';
      if (task?.partialHoldActive) {
        const target = partialHoldTargetForGridRow(task, row, index);
        if (!target.found) {
          return {
            mode: 'partial', target, status: current, syncAction: 'REVIEW_SKIP',
            syncReason: 'partial_hold_item_match_missing'
          };
        }
        // With no order-level state, an exact partial ON is safe; an OFF is
        // not applied unless the order current state explicitly says OFF.
        if (!task.systemShippingHoldKnown && !target.hold) {
          return {
            mode: 'partial', target, status: current, syncAction: 'REVIEW_SKIP',
            syncReason: 'partial_hold_system_state_unknown'
          };
        }
        const status = target.hold ? 'ON' : 'OFF';
        return {
          mode: 'partial', target, status,
          syncAction: current === status ? 'NONE' : (status === 'ON' ? 'SET_ON' : 'SET_OFF'),
          syncReason: target.matchMethod
        };
      }
      const systemShippingHold = systemShippingHoldForTask(task);
      const syncAction = holdSyncAction(current, systemShippingHold);
      return {
        mode: 'order', target: null,
        status: syncAction === 'SET_ON' ? 'ON' : syncAction === 'SET_OFF' ? 'OFF' : current,
        syncAction,
        syncReason: holdSyncReason(task, syncAction)
      };
    }

    // Management memo1 is invoice-scoped; management memo2 remains item-scoped.
    // Refuse a live write when legacy rows disagree instead of spreading an
    // arbitrary first value across the invoice.
    function buildManagementMemoTargets(ordNo, orderItemRows, pickingRows) {
      const targets = new Map();
      const ambiguousTargets = new Set();
      const memo1Values = [...new Set((orderItemRows || []).map(row => normal(row.o_shop_memo)).filter(Boolean))];
      const pickingMemo1Values = [...new Set((pickingRows || [])
        .map(row => normal(row.drawer_no))
        .filter(value => value && value !== 'EMPTY'))];
      const memo1SourceValues = (orderItemRows || []).length ? memo1Values : pickingMemo1Values;
      const memo1Conflict = memo1SourceValues.length > 1;
      const invoiceMemo1 = memo1Conflict ? '' : (memo1SourceValues[0] || '');
      const stats = {
        matchedByItemNo: 0,
        matchedBySellpiaOrderItemNo: 0,
        skipped: 0,
        ambiguous: 0,
        memo1Conflict,
        memo1Values: memo1SourceValues,
      };
      for (const row of orderItemRows || []) {
        const target = {
          memo1: invoiceMemo1,
          memo2: normal(row.o_shop_memo2),
          dbMemo1: normal(row.o_shop_memo),
          dbMemo2: normal(row.o_shop_memo2),
          orderItemNo: normal(row.item_no),
          matchMethod: 'order_items_exact',
        };
        const itemKeys = [...new Set([row.item_no, row.sellpia_order_item_no]
          .map(itemNo => managementTargetKey(ordNo, itemNo))
          .filter(Boolean))];
        for (const key of itemKeys) addUniqueManagementTarget(targets, ambiguousTargets, key, target);
        stats.matchedByItemNo++;
      }
      stats.ambiguous = ambiguousTargets.size;
      return { targets, ambiguousTargets, stats, memo1Conflict, memo1Values: memo1SourceValues };
    }

    function managementTargetForGridRow(task, row, index) {
      const candidates = [rowItemNoStrict(row), rowItemNo(row, index), normal(row.c_prv_item_no)].filter(Boolean);
      for (const itemNo of candidates) {
        const key = managementTargetKey(task?.ordNo || rowOrdNo(row), itemNo);
        if (!key || task?.managementMemoAmbiguous?.has(key)) continue;
        if (task?.managementMemoTargets?.has(key)) {
          return { found: true, ...task.managementMemoTargets.get(key) };
        }
      }
      return { found: false, memo1: '', memo2: '', dbMemo1: '', dbMemo2: '', orderItemNo: '', matchMethod: 'none' };
    }

    function memo1TargetForGridRow(task, row, index) {
      const target = managementTargetForGridRow(task, row, index);
      return { ...target, value: target.memo1 };
    }

    function memo2TargetForGridRow(task, row, index) {
      const target = managementTargetForGridRow(task, row, index);
      return { ...target, value: target.memo2 };
    }

    function memo2ForGridRow(task, row, index) {
      return memo2TargetForGridRow(task, row, index).value;
    }

    function memo2ClearForGridRow(task, row, index) {
      if (!task || !task.memo2ClearMap) return false;
      const keys = gridItemAliasKeys(task, row, index);
      if (keys.some(key => task.memo2ConflictMap?.has(key))) return false;
      return keys.some(key => task.memo2ClearMap.has(key));
    }

    function orderMemoForGridRow(task, row, index) {
      return orderMemoTargetForGridRow(task, row, index).value;
    }

    function orderMemoSourceForGridRow(task, row, index) {
      const target = orderMemoTargetForGridRow(task, row, index);
      if (target.found) return 'item_level_' + target.matchMethod;
      return target.known ? 'not_requested' : 'none';
    }

    function plannedOrderMemoForGridRow(task, row, index, currentOrderMemo) {
      if (task.clear) return '';
      const itemTarget = orderMemoTargetForGridRow(task, row, index);
      if (task.writeOrderMemo && itemTarget.found) return itemTarget.value;
      return currentOrderMemo;
    }

    function shippingHoldNeedsReview(planned = {}) {
      return !!planned.holdWriteRequested
        && (planned.holdSyncAction === 'UNKNOWN' || planned.holdSyncAction === 'REVIEW_SKIP');
    }

    function currentWarningsForGridRow(task, row, index, planned) {
      const match = gridItemMatchInfo(task, row, index);
      const keys = gridItemAliasKeys(task, row, index);
      const warnings = [];
      const memo2Target = memo2ForGridRow(task, row, index);
      const orderMemoSource = orderMemoSourceForGridRow(task, row, index);
      const currentOrderMemo = normal(planned?.currentOrderMemo);
      const plannedOrderMemo = normal(planned?.plannedOrderMemo);
      const orderMemoTarget = normal(planned?.orderMemoTarget);
      const orderMemoTargetInfo = orderMemoTargetForGridRow(task, row, index);
      if (match.failed) warnings.push(match.warning || 'item_key_match_failed');
      if (task?.writeOrderMemo && !task.clear && orderMemoTargetInfo.warning) warnings.push(orderMemoTargetInfo.warning);
      if (shippingHoldNeedsReview(planned)) warnings.push('shipping_hold_unknown');
      if (keys.some(key => task.memo2ConflictMap?.has(key))) warnings.push('memo2_event_conflict');
      if (task.clear && memo2Target) warnings.push('completed_but_memo2_exists');
      if (task.clear && memo2Target) warnings.push('inspection_completed_with_shortage_open');
      if (!task.dbMatchStatus || task.dbMatchStatus === 'DB 매칭 없음') warnings.push('missing_current_source');
      if (!task.clear && orderMemoTarget && !plannedOrderMemo) warnings.push('pre_inspection_order_memo_clear');
      if (!task.clear && currentOrderMemo && !plannedOrderMemo && !orderMemoTarget && (orderMemoSource === 'invoice_level_reference' || orderMemoSource === 'none')) {
        warnings.push('order_memo_clear_without_item_target');
        if (orderMemoSource === 'invoice_level_reference') warnings.push('invoice_level_order_memo_clear');
      }
      return [...new Set(warnings)];
    }

    function decideLiveWriteAllowed(warnings) {
      const list = new Set(warnings || []);
      const hardBlock = [
        'item_key_match_failed',
        'item_key_prefix_collision',
        'memo2_event_conflict',
        'completed_but_memo2_exists',
        'inspection_completed_with_shortage_open',
        'missing_current_source',
        'pre_inspection_order_memo_clear',
        'order_memo_clear_without_item_target',
        'invoice_level_order_memo_clear',
        'order_memo_target_missing',
        'order_memo_target_ambiguous'
      ];
      if (hardBlock.some(type => list.has(type))) return 'N';
      if (list.has('order_memo_fallback_invoice_level') || list.has('memo1_conflict') || list.has('completed_then_reopened') || list.has('shipping_hold_unknown')) return 'REVIEW';
      return 'Y';
    }

    function buildRowPolicyMeta(task, row, index, planned = {}) {
      const match = gridItemMatchInfo(task, row, index);
      const memo2Target = memo2ForGridRow(task, row, index);
      const orderMemoTarget = orderMemoForGridRow(task, row, index);
      const orderMemoSource = orderMemoSourceForGridRow(task, row, index);
      const warnings = currentWarningsForGridRow(task, row, index, {
        ...planned,
        orderMemoTarget
      });
      const liveWriteAllowed = decideLiveWriteAllowed(warnings);
      return {
        liveWriteAllowed,
        currentStateWarning: warnings.join(' / '),
        itemKeyMatchMethod: match.method,
        sellpiaItemNoOriginal: match.original,
        sellpiaItemNoMatchKey: match.matchKey,
        orderMemoSource,
        memo2Target,
        orderMemoTarget
      };
    }

    function workflowDoneByOrdNo(rows) {
      const map = new Map();
      for (const row of rows || []) {
        const ord = normal(row.order_group_no);
        if (!ord) continue;
        if (!map.has(ord)) map.set(ord, []);
        map.get(ord).push(row);
      }

      const doneMap = new Map();
      for (const [ord, events] of map.entries()) {
        const sorted = [...events].sort((a, b) => {
          const at = new Date(a.event_at || a.created_at || 0).getTime() || 0;
          const bt = new Date(b.event_at || b.created_at || 0).getTime() || 0;
          if (at !== bt) return at - bt;
          return (Number(a.id || 0) || 0) - (Number(b.id || 0) || 0);
        });

        let inspected = false;
        let cancelled = false;
        let lastAt = '';
        for (const ev of sorted) {
          const type = normal(ev.event_type);
          lastAt = ev.event_at || ev.created_at || lastAt;
          if (type === 'inspection_completed') {
            inspected = true;
            cancelled = false;
          } else if (type === 'inspection_reopened') {
            inspected = false;
          } else if (type === 'cancelled') {
            cancelled = true;
            inspected = false;
          }
        }

        doneMap.set(ord, {
          done: inspected && !cancelled,
          lastAt,
          count: sorted.length
        });
      }
      return doneMap;
    }

    function workflowItemDoneByOrdNo(rows) {
      const grouped = new Map();
      for (const row of rows || []) {
        const ord = normal(row.order_group_no || row.ord_no);
        const itemKey = normal(row.sellpia_item_no || row.item_no || row.sellpia_order_item_no || row.sellpia_product_code || row.p_code);
        if (!ord) continue;
        if (!itemKey) continue;
        const key = ord + '::' + itemKey;
        if (!grouped.has(key)) {
          grouped.set(key, { ord, rows: [] });
        }
        grouped.get(key).rows.push(row);
      }

      const doneMap = new Map();
      for (const entry of grouped.values()) {
        const sorted = [...entry.rows].sort((a, b) => {
          const at = new Date(a.event_at || a.created_at || 0).getTime() || 0;
          const bt = new Date(b.event_at || b.created_at || 0).getTime() || 0;
          if (at !== bt) return at - bt;
          return (Number(a.id || 0) || 0) - (Number(b.id || 0) || 0);
        });
        const last = sorted[sorted.length - 1];
        if (!last || normal(last.event_type) !== 'shortage_repick_completed') continue;
        if (!doneMap.has(entry.ord)) {
          doneMap.set(entry.ord, { rows: [], lastAt: '', count: 0 });
        }
        const target = doneMap.get(entry.ord);
        target.rows.push(last);
        target.count++;
        target.lastAt = last.event_at || last.created_at || target.lastAt;
      }
      return doneMap;
    }

    function buildTask(invNo, ordNo, shortageRows, pickingRows, orderRowsInput, orderItemRowsInput, workflowDone, workflowItemDone) {
      const orderRows = Array.isArray(orderRowsInput) ? orderRowsInput : (orderRowsInput ? [orderRowsInput] : []);
      const orderItemRows = Array.isArray(orderItemRowsInput) ? orderItemRowsInput : (orderItemRowsInput ? [orderItemRowsInput] : []);
      const firstOrderRow = orderRows[0] || {};
      const scrapedShippingHold = scrapedShippingHoldFromOrderRows(orderRows);
      const systemShippingHoldCurrent = systemShippingHoldFromOrderRows(orderRows);
      const task = {
        invNo: normal(invNo || firstOrderRow?.inv_no),
        ordNo: normal(ordNo || firstOrderRow?.ord_no),
        memo1: '',
        managementMemoTargets: new Map(),
        managementMemoAmbiguous: new Set(),
        managementMemoStats: null,
        memo2Map: new Map(),
        memo2ClearMap: new Set(),
        memo2ConflictMap: new Set(),
        orderMemoMap: new Map(),
        orderMemoAmbiguousKeys: new Set(),
        orderMemoNormalizedMap: new Map(),
        orderMemoNormalizedAmbiguousKeys: new Set(),
        orderMemoRequestedCount: 0,
        outboundConfirmedDateTargets: new Map(),
        outboundConfirmedDateAmbiguous: new Set(),
        partialHoldTargets: new Map(),
        partialHoldAmbiguous: new Set(),
        partialHoldStats: null,
        partialHoldActive: false,
        outboundScheduledDate: normal(firstOrderRow?.sellpia_outbound_scheduled_date),
        itemKeyIndex: buildItemKeyIndex(orderItemRows, normal(ordNo || firstOrderRow?.ord_no)),
        hold: false,
        systemShippingHold: systemShippingHoldCurrent.status,
        systemShippingHoldKnown: systemShippingHoldCurrent.known,
        systemShippingHoldSource: systemShippingHoldCurrent.source || '',
        systemShippingHoldUpdatedAt: systemShippingHoldCurrent.updatedAt || '',
        sellpiaShippingHoldScraped: scrapedShippingHold.status || '',
        sellpiaShippingHoldRaw: scrapedShippingHold.raw || '',
        sellpiaShippingHoldScrapedAt: scrapedShippingHold.scrapedAt || '',
        shippingHoldSyncReason: systemShippingHoldCurrent.syncReason || '',
        clear: false,
        writeMemo1: false,
        writeMemo2: false,
        writeOrderMemo: false,
        writeOutboundDates: false,
        writeHold: false,
        skip: false,
        reason: '',
        workflowDone: !!workflowDone?.done,
        dbMatchStatus: ''
      };
      const hasShortageMatch = !!(shortageRows || []).length;
      const hasPickingMatch = !!(pickingRows || []).length;
      const hasOrderMatch = orderRows.some(row => !!normal(row?.ord_no));
      const hasOrderItemsMemo1 = orderItemRows.some(row => !!normal(row?.o_shop_memo));
      const hasOrderItemsMemo2 = orderItemRows.some(row => !!normal(row?.o_shop_memo2));
      const workflowItemDoneRows = (workflowItemDone && workflowItemDone.rows) || [];
      const hasDbMatch = hasShortageMatch || hasPickingMatch || hasOrderMatch || hasOrderItemsMemo1 || hasOrderItemsMemo2;
      task.dbMatchStatus = [
        hasShortageMatch ? 'shortage' : '',
        hasPickingMatch ? 'picking' : '',
        hasOrderMatch ? 'orders' : '',
        hasOrderItemsMemo1 ? 'order_items_memo1' : '',
        hasOrderItemsMemo2 ? 'order_items_memo2' : '',
        workflowItemDoneRows.length ? 'workflow_item_done' : '',
        workflowDone?.done ? 'workflow_done' : ''
      ].filter(Boolean).join('+') || 'DB 매칭 없음';

      const managementTargets = buildManagementMemoTargets(task.ordNo, orderItemRows, pickingRows);
      task.managementMemoTargets = managementTargets.targets;
      task.managementMemoAmbiguous = managementTargets.ambiguousTargets;
      task.managementMemoStats = managementTargets.stats;
      if (managementTargets.memo1Conflict) {
        task.skip = true;
        task.reason = '관리메모1 송장 전체값 충돌: ' + managementTargets.memo1Values.join(' / ');
        task.dbMatchStatus += '+memo1_conflict';
        return task;
      }
      const partialHoldTargets = buildPartialHoldTargets(task.ordNo, task.invNo, orderItemRows, pickingRows);
      task.partialHoldTargets = partialHoldTargets.targets;
      task.partialHoldAmbiguous = partialHoldTargets.ambiguous;
      task.partialHoldStats = partialHoldTargets.stats;
      // An order-level ON remains a full-order hold.  Otherwise, if any exact
      // picking row is held, use the item-level map for this order.
      task.partialHoldActive = task.systemShippingHold !== 'ON' && partialHoldTargets.stats.holdOn > 0;
      const outboundConfirmedTargets = buildOutboundConfirmedDateTargets(task.ordNo, orderItemRows);
      task.outboundConfirmedDateTargets = outboundConfirmedTargets.targets;
      task.outboundConfirmedDateAmbiguous = outboundConfirmedTargets.ambiguous;

      const activeRows = [];
      const nextShipRows = [];
      for (const row of shortageRows || []) {
        const status = normal(row.status);
        const drawer = normal(row.drawer_no);
        if (isNextShipStatus(status)) nextShipRows.push(row);
        else if (drawer || status === '보류' || status === '배송대기' || status === '서랍입력') activeRows.push(row);
      }

      for (const row of orderItemRows) {
        addOrderMemoTarget(task, row);
      }

      const hasMemo1Value = task.managementMemoTargets.size > 0;
      const hasMemo2Value = task.managementMemoTargets.size > 0;
      const hasMemo2Clear = false;
      const allShortageItemsRepicked = false;
      const hasSystemMatch = hasShortageMatch || hasPickingMatch || hasOrderMatch || orderItemRows.length > 0;
      const hasOrderMemoValue = hasSystemMatch && task.orderMemoRequestedCount > 0;
      const memo1HoldSignal = false;
      // A shortage table row can be absent even while another item still has an
      // active memo2 target (for example, a shortage reopened after repick).
      // Do not clear this invoice's memo1 until every active item target is gone.
      const shouldClearMemo1ForAllRepicked = false;

      if (workflowDone?.done) {
        task.clear = true;
        task.memo1 = '';
        task.writeMemo1 = true;
        task.writeMemo2 = true;
        task.writeOrderMemo = true;
        task.writeHold = task.systemShippingHoldKnown || task.partialHoldActive;
        task.hold = task.systemShippingHold === 'ON';
        task.reason = '검품완료(workflow): 관리메모/관리메모2/주문메모 삭제';
        return task;
      }

      task.writeMemo1 = hasMemo1Value;
      task.writeMemo2 = hasMemo2Value;
      task.writeOrderMemo = hasOrderMemoValue;
      task.writeHold = task.systemShippingHoldKnown || task.partialHoldActive;

      task.hold = task.systemShippingHold === 'ON';

      if (hasMemo2Clear && !(task.writeMemo1 || hasMemo2Value || task.writeOrderMemo || task.writeHold)) {
        task.reason = '미송피킹완료(workflow_item): 관리메모2 clear';
      } else if (task.writeMemo1 || task.writeMemo2 || task.writeOrderMemo || task.writeHold) {
        task.reason = shouldClearMemo1ForAllRepicked
          ? '송장 전체 미송피킹완료(workflow_item): 관리메모1 clear + 관리메모2 clear'
          : hasMemo2Clear
          ? '미송피킹완료(workflow_item) 포함: 관리메모2 clear + 잔여 메모 대상 반영'
          : '잔여 메모 대상: 서랍번호 또는 주문메모 반영';
      } else {

    function needsChange(cur, planned) {
      return normal(cur) !== normal(planned);
    }

    function sellpiaDateValue(value) {
      const text = normal(value);
      const match = text.match(/^(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
      if (!match) return '';
      return match[1] + '-' + String(Number(match[2])).padStart(2, '0') + '-' + String(Number(match[3])).padStart(2, '0');
    }

    function dateNeedsChange(current, planned) {
      return sellpiaDateValue(current) !== sellpiaDateValue(planned);
    }

    function applyHoldCsvMeta(result, task) {
      if (!result || !task) return result;
      result.systemShippingHoldSource = task.systemShippingHoldSource || result.systemShippingHoldSource || '';
      result.systemShippingHoldKnown = task.systemShippingHoldKnown ? 'Y' : 'N';
      result.systemShippingHoldUpdatedAt = task.systemShippingHoldUpdatedAt || '';
      result.sellpiaShippingHoldScraped = task.sellpiaShippingHoldScraped || '';
      result.sellpiaShippingHoldScrapedAt = task.sellpiaShippingHoldScrapedAt || '';
      return result;
    }

    function addResult(result) {
      results.push(result);
      const log = $('smu0707-log');
      log.textContent += result.log + '\n';
      log.scrollTop = log.scrollHeight;
      $('smu0707-download').disabled = !results.length;
      const issueBtn = $('smu0707-issue-download');
      if (issueBtn) issueBtn.disabled = !results.some(isIssueResult);
      renderBlockedOrderPanel();
    }

    function perfNow() {
      return (window.performance && window.performance.now) ? window.performance.now() : Date.now();
    }

    function perfMs(start) {
      return Math.round(perfNow() - start);
    }

    function newPerf() {
      return {
        totalStart: perfNow(),
        openMs: null,
        readMs: null,
        writeMs: null,
        closeMs: null,
        openFallback: null,
        openRoot: null,
        openReady: null,
        closeFallback: null,
        closeRoot: null,
        closeBtn: null
      };
    }

    function perfText(perf) {
      if (!perf) return '';
      const parts = [];
      if (perf.openMs != null) parts.push('open=' + perf.openMs + 'ms');
      if (perf.readMs != null) parts.push('read=' + perf.readMs + 'ms');
      if (perf.writeMs != null) parts.push('write=' + perf.writeMs + 'ms');
      if (perf.closeMs != null) parts.push('close=' + perf.closeMs + 'ms');
      parts.push('total=' + perfMs(perf.totalStart) + 'ms');
      if (perf.openFallback != null) parts.push('openFallback=' + perf.openFallback);
      if (perf.openRoot != null) parts.push('openRoot=' + perf.openRoot);
      if (perf.openReady != null) parts.push('openReady=' + perf.openReady);
      if (perf.closeFallback != null) parts.push('closeFallback=' + perf.closeFallback);
      if (perf.closeRoot != null) parts.push('closeRoot=' + perf.closeRoot);
      if (perf.closeBtn != null) parts.push('closeBtn=' + perf.closeBtn);
      return 'PERF ' + parts.join(', ');
    }

    function withPerf(result, perf) {
      const text = perfText(perf);
      if (!perf) return result;
      return {
        ...result,
        perfOpenMs: perf.openMs != null ? perf.openMs : '',
        perfReadMs: perf.readMs != null ? perf.readMs : '',
        perfWriteMs: perf.writeMs != null ? perf.writeMs : '',
        perfCloseMs: perf.closeMs != null ? perf.closeMs : '',
        perfTotalMs: perfMs(perf.totalStart),
        perfOpenFallback: perf.openFallback != null ? perf.openFallback : '',
        perfOpenRoot: perf.openRoot != null ? perf.openRoot : '',
        perfOpenReady: perf.openReady != null ? perf.openReady : '',
        perfCloseFallback: perf.closeFallback != null ? perf.closeFallback : '',
        perfCloseRoot: perf.closeRoot != null ? perf.closeRoot : '',
        perfCloseBtn: perf.closeBtn != null ? perf.closeBtn : '',
        log: text ? result.log + ' / ' + text : result.log
      };
    }

    function sampleList(values) {
      const list = (values || []).slice(0, 5);
      return list.join(', ') + ((values || []).length > list.length ? ' ...' : '');
    }

    function taskBatchLabel(task) {
      const inv = normal(task && task.invNo);
      const ord = normal(task && task.ordNo);
      if (inv && ord) return inv + ' / ' + ord;
      return inv || ord || '-';
    }

    function sortTasksForBatch(tasks) {
      return (tasks || []).map((task, index) => ({ task, index })).sort((left, right) => {
        const invCompare = normal(left.task.invNo).localeCompare(normal(right.task.invNo));
        if (invCompare) return invCompare;
        const ordCompare = normal(left.task.ordNo).localeCompare(normal(right.task.ordNo));
        if (ordCompare) return ordCompare;
        return left.index - right.index;
      }).map(entry => entry.task);
    }

    function selectTaskBatch(tasks, batchSize, batchNo) {
      const sorted = sortTasksForBatch(tasks);
      const total = sorted.length;
      const batchTotal = Math.ceil(total / batchSize);
      const start = (batchNo - 1) * batchSize;
      const end = Math.min(start + batchSize, total);
      const selected = sorted.slice(start, end);
      return {
        tasks: selected,
        meta: {
          batchEnabled: true,
          batchSize,
          batchNo,
          batchTotal,
          batchTotalTargets: total,
          batchStart: start + 1,
          batchEnd: end,
          batchSelectedTargets: Math.max(0, end - start),
          batchFirstTarget: taskBatchLabel(selected[0]),
          batchLastTarget: taskBatchLabel(selected[selected.length - 1])
        }
      };
    }

    function promptTaskBatch(tasks, batchSize) {
      const total = (tasks || []).length;
      const batchTotal = Math.ceil(total / batchSize);
      const input = prompt('총 ' + total + '개 대상, ' + batchSize + '개 단위, 총 ' + batchTotal + '배치입니다. 실행할 배치 번호를 입력하세요.');
      if (input == null || !normal(input)) return null;
      const batchNo = Number(normal(input));
      if (!Number.isInteger(batchNo) || batchNo < 1 || batchNo > batchTotal) {
        alert('배치 번호는 1부터 ' + batchTotal + ' 사이의 숫자로 입력해주세요.');
        return null;
      }
      const selected = selectTaskBatch(tasks, batchSize, batchNo);
      const meta = selected.meta;
      const ok = confirm('배치 ' + meta.batchNo + '/' + meta.batchTotal + ' 실행 확인\n' +
        '대상 index: ' + meta.batchStart + '-' + meta.batchEnd + ' / ' + meta.batchTotalTargets + '\n' +
        '선택 대상 수: ' + meta.batchSelectedTargets + '\n' +
        '첫 대상: ' + meta.batchFirstTarget + '\n' +
        '마지막 대상: ' + meta.batchLastTarget + '\n\n' +
        '이 배치만 실행할까요?');
      return ok ? selected : null;
    }

    function buildMetaLines(tasks) {
      const meta = lastBuildMeta || {};
      const lines = [
        '그리드 행=' + (meta.gridRows ?? '?') + ', 고유 주문 대상=' + (meta.uniqueOrdNos ?? tasks.length) + ', 작업=' + tasks.length,
        '전체 행 불러오기: 전=' + (meta.gridRowsBeforeAll ?? meta.gridRows ?? '?') + ', 후=' + (meta.gridRows ?? '?') + ', 전체버튼=' + (meta.clickedAllRows ? '사용' : '미사용'),
        '안내: 주문 하나에 상품행이 여러 개면 그리드 행 수와 고유 주문 대상 수는 다를 수 있습니다.',
        '피킹 매칭 주문=' + (meta.pickingMatchedOrders ?? 0) + ', 보류 행=' + (meta.pickingHoldRows ?? 0) + ', 서랍번호 행=' + (meta.pickingDrawerRows ?? 0)
      ];
      if (meta.inputTargetCount) lines.push('입력 대상=' + meta.inputTargetCount + ', 매칭=' + (meta.matchedInputTargetCount ?? 0) + ', 미매칭=' + (meta.unmatchedInputTargets || []).length);
      if ((meta.unmatchedInputTargets || []).length) lines.push('주의: 찾지 못한 입력=' + sampleList(meta.unmatchedInputTargets));
      if (meta.missingOrdRows) lines.push('주의: 주문번호가 비어 있는 그리드 행=' + meta.missingOrdRows);
      if ((meta.multiInvOrdNos || []).length) lines.push('주의: 송장번호가 여러 개인 주문=' + meta.multiInvOrdNos.length + ' [' + sampleList(meta.multiInvOrdNos) + ']');
      if ((meta.dbMissingOrdNos || []).length) lines.push('주의: DB에서 현재 상태를 찾지 못한 주문=' + meta.dbMissingOrdNos.length + ' [' + sampleList(meta.dbMissingOrdNos) + ']');
      if ((meta.optionalDbWarnings || []).length) lines.push('주의: 선택 DB 조회 실패: ' + meta.optionalDbWarnings.join(' / '));
      if (meta.batchEnabled) {
        lines.push('분할 실행: ' + meta.batchNo + '/' + meta.batchTotal + '배치, 배치크기=' + meta.batchSize + ', 선택=' + meta.batchSelectedTargets + ', 전체 대상 순번=' + meta.batchStart + '-' + meta.batchEnd + '/' + meta.batchTotalTargets);
        lines.push('배치 범위: 첫 대상=' + meta.batchFirstTarget + ', 마지막 대상=' + meta.batchLastTarget);
      }
      return lines;
    }

    function summarizeResults() {
      const statusCounts = {};
      const liveCounts = {};
      let unknown = 0;
      let issueCount = 0;
      let clearOff = 0;
      let clearOffLiveY = 0;
      let memo1Clear = 0;
      let memo2Clear = 0;
      let orderMemoClear = 0;
      let holdSyncOff = 0;
      let holdSyncOffLiveY = 0;
      for (const r of results) {
        statusCounts[r.status || ''] = (statusCounts[r.status || ''] || 0) + 1;
        liveCounts[r.liveWriteAllowed || ''] = (liveCounts[r.liveWriteAllowed || ''] || 0) + 1;
        if (r.needsChange === 'UNKNOWN') unknown++;
        if (isIssueResult(r)) issueCount++;
        if (r.needsChange === 'SNAPSHOT') continue;
        const rowMemo1Clear = normal(r.currentMemo1) && !normal(r.plannedMemo1);
        const rowMemo2Clear = normal(r.currentMemo2) && !normal(r.plannedMemo2);
        const rowOrderMemoClear = normal(r.currentOrderMemo) && !normal(r.plannedOrderMemo);
        const rowHoldSyncOff = r.syncAction === 'SET_OFF';
        if (rowMemo1Clear) memo1Clear++;
        if (rowMemo2Clear) memo2Clear++;
        if (rowOrderMemoClear) orderMemoClear++;
        if (rowHoldSyncOff) holdSyncOff++;
        if (r.liveWriteAllowed === 'Y' && (rowMemo1Clear || rowMemo2Clear || rowOrderMemoClear || rowHoldSyncOff)) clearOffLiveY++;
        if (r.liveWriteAllowed === 'Y' && rowHoldSyncOff) holdSyncOffLiveY++;
      }
      clearOff = memo1Clear + memo2Clear + orderMemoClear + holdSyncOff;
      const blocking = !!(statusCounts.SKIP || statusCounts.DETAIL_FAIL || statusCounts.MATCH_FAIL || statusCounts.WRITE_FAIL || statusCounts.PARTIAL_FAIL || unknown);
      const lines = [
        '결과 요약: ' + Object.keys(statusCounts).sort().map(key => key + '=' + statusCounts[key]).join(', '),
        '실행 허용 상태: ' + Object.keys(liveCounts).sort().map(key => (key || '빈값') + '=' + liveCounts[key]).join(', '),
        '확인 필요 행(차단/실패/경고/불명확)=' + issueCount,
        '메모 삭제/보류 해제 예정=' + clearOff + ' (관리메모1=' + memo1Clear + ', 관리메모2=' + memo2Clear + ', 주문메모=' + orderMemoClear + ', 배송보류해제=' + holdSyncOff + ')',
        '실행 허용(Y) 중 삭제/해제 예정=' + clearOffLiveY + ' (배송보류해제=' + holdSyncOffLiveY + ')'
      ];
      if (blocking) lines.push('주의: 건너뜀/상세실패/매칭실패/저장실패/부분실패/불명확 항목이 있어 전체 또는 일부 실행이 차단됩니다.');
      if (clearOff >= 10) lines.push('주의: 메모 삭제 또는 보류 해제 예정이 많습니다. 실제 실행 전에 CSV를 확인해주세요.');
      return { blocking, clearOff, lines };
    }

    function failReason(message, task) {
      return message + (task && task.reason ? ' / planned: ' + task.reason : '');
    }

    async function syncManagementMemoDb(rowResult) {
      const ordNo = normal(rowResult?.ordNo);
      const itemNo = normal(rowResult?.managementOrderItemNo);
      if (!ordNo || !itemNo) return { status: 'SKIP_NO_ITEM_MATCH' };
      const patch = {};
      if (normal(rowResult.dbMemo1) !== normal(rowResult.dbTargetMemo1)) patch.o_shop_memo = rowResult.dbTargetMemo1 || '';
      if (normal(rowResult.dbMemo2) !== normal(rowResult.dbTargetMemo2)) patch.o_shop_memo2 = rowResult.dbTargetMemo2 || '';
      if (!Object.keys(patch).length) return { status: 'NO_CHANGE' };
      await dbPatch('order_items', 'ord_no=eq.' + encodeURIComponent(ordNo) + '&item_no=eq.' + encodeURIComponent(itemNo), patch);
      return { status: 'UPDATED', patch };
    }

    function testLogSummary(rowResult) {
      if (rowResult?.liveWriteAllowed === 'Y') return rowResult.actionSummary || '변경 없음';
      const decision = rowResult?.liveWriteAllowed === 'REVIEW' ? '검토 필요' : '차단';
      return decision
        + ': live_write_allowed=' + (rowResult?.liveWriteAllowed || 'N')
        + (rowResult?.currentStateWarning ? ' / ' + rowResult.currentStateWarning : '');
    }

    async function setPopupValues(root, rowResult, testMode) {
      if (testMode) {
        return { ...rowResult, dbSync: rowResult.dbSync || (rowResult.managementOrderItemNo ? 'NO_CHANGE' : 'SKIP_NO_ITEM_MATCH'), log: '테스트(TEST): ' + rowResult.invNo + ' / ' + testLogSummary(rowResult) };
      }
      if (rowResult.liveWriteAllowed !== 'Y') {
        return {
          ...rowResult,
          status: rowResult.liveWriteAllowed === 'REVIEW' ? 'REVIEW_SKIP' : 'LIVE_BLOCKED',
          needsChange: rowResult.needsChange || 'N',
          reason: (rowResult.reason || '') + ' / live_write_allowed=' + (rowResult.liveWriteAllowed || 'N') + ' / ' + (rowResult.currentStateWarning || ''),
          log: '실행 건너뜀: ' + rowResult.invNo + ' / 실행 허용=' + (rowResult.liveWriteAllowed || 'N')
        };
      }
      let popupTarget = { orderNo: '', itemNo: '' };
      let memo1Safety = null;
      if (rowResult.writeMemo1) {
        // Management memo 1 is invoice-level in Sellpia, but its value still
        // must never be written through a detail popup for a different item.
        memo1Safety = inspectMemo1PopupSafety(root, rowResult);
        popupTarget = memo1Safety.popupTarget;
      } else if (rowResult.writeMemo2 || rowResult.writeOrderMemo || rowResult.writeOutboundScheduledDate || rowResult.writeOutboundConfirmedDate || rowResult.writeHold) {
        // Every item-scoped write, including partial shipping hold, must
        // prove that the opened Sellpia popup belongs to this exact item.
        popupTarget = assertPopupTargetMatches(root, rowResult);
      }
      let memo1InputBefore = '';
      let memo1InputAfter = '';
      if (rowResult.writeMemo1) {
        const applyAll = memo1Safety.applyAll;
        if (applyAll.checked) {
          applyAll.click();
          await sleep(120);
        }
        if (applyAll.checked) throw new Error('관리메모 전체적용 체크박스를 OFF로 변경하지 못했습니다.');
        const el = memo1Safety.input;
        memo1InputBefore = memo1Safety.inputBefore;
        setInputValue(el, rowResult.plannedMemo1);
        memo1InputAfter = normal(el.value);
        if (memo1InputAfter !== normal(rowResult.plannedMemo1)) {
          throw new Error('관리메모 입력값 검증 실패: expected=' + normal(rowResult.plannedMemo1) + ', actual=' + memo1InputAfter);
        }
      }
      if (rowResult.writeMemo2) {
        const applyAll = memo2ApplyAllCheckbox(root);
        if (applyAll && applyAll.checked) {
          applyAll.click();
          await sleep(120);
        }
        if (applyAll && applyAll.checked) throw new Error('관리메모2 전체적용 체크박스를 OFF로 변경하지 못했습니다.');
        const el = root.querySelector('#dt_shop_memo2,[name="dt_shop_memo2"]');
        if (!el) throw new Error('관리메모2 입력 필드를 찾지 못했습니다.');
        setInputValue(el, rowResult.plannedMemo2);
        if (normal(el.value) !== normal(rowResult.plannedMemo2)) throw new Error('관리메모2 입력값 검증 실패');
      }
      if (rowResult.writeOrderMemo) {
        const applyAll = orderMemoApplyAllCheckbox(root);
        if (!applyAll) throw new Error('주문메모 전체적용 체크박스를 찾지 못했습니다. 상품별 저장을 중단합니다.');
        if (applyAll.checked) {
          applyAll.click();
          await sleep(120);
        }
        if (applyAll.checked) throw new Error('주문메모 전체적용 체크박스를 OFF로 변경하지 못했습니다.');
        const el = root.querySelector('#dt_ord_memo,#dt_order_memo,[name="dt_ord_memo"]');
        if (!el) throw new Error('주문메모 입력 필드를 찾지 못했습니다.');
        setInputValue(el, rowResult.plannedOrderMemo);
        if (normal(el.value) !== normal(rowResult.plannedOrderMemo)) throw new Error('주문메모 입력값 검증 실패');
      }
      if (rowResult.writeOutboundScheduledDate) {
        const el = root.querySelector('#dt_delirsvin_date,[name="dt_delirsvin_date"]');
        if (!el) throw new Error('Outbound scheduled date input was not found.');
        setInputValue(el, rowResult.plannedOutboundScheduledDate);
        if (needsChange(el.value, rowResult.plannedOutboundScheduledDate)) {
          throw new Error('Outbound scheduled date input verification failed.');
        }
      }
      if (rowResult.writeOutboundConfirmedDate) {
        const el = root.querySelector('#dt_delirsvout_date,[name="dt_delirsvout_date"]');
        if (!el) throw new Error('Outbound confirmed date input was not found.');
        setInputValue(el, rowResult.plannedOutboundConfirmedDate);
        if (dateNeedsChange(el.value, rowResult.plannedOutboundConfirmedDate)) {
          throw new Error('Outbound confirmed date input verification failed.');
        }
      }
      if (rowResult.writeHold) {
        const cb = holdCheckbox(root);
        if (!cb) throw new Error('배송보류 체크박스를 찾지 못했습니다.');
        const wantHold = plannedHoldBool(rowResult);
        if (!!cb.checked !== wantHold) cb.click();
        await sleep(120);
        if (!!cb.checked !== wantHold) throw new Error('배송보류 상태 변경 실패: expected=' + (wantHold ? 'ON' : 'OFF') + ', actual=' + (cb.checked ? 'ON' : 'OFF'));
      }
      const hasSellpiaWrite = rowResult.writeMemo1 || rowResult.writeMemo2 || rowResult.writeOrderMemo || rowResult.writeHold || rowResult.writeOutboundScheduledDate || rowResult.writeOutboundConfirmedDate;
      if (!hasSellpiaWrite) {
        const dbSync = await syncManagementMemoDb(rowResult);
        return {
          ...rowResult,
          popupOrderNo: popupTarget.orderNo,
          popupItemNo: popupTarget.itemNo,
          memo1InputBefore,
          memo1InputAfter,
          dbSync: dbSync.status,
          log: '실행 DB 동기화: ' + rowResult.invNo + ' / ' + dbSync.status
        };
      }
      if (typeof window.updateOrder !== 'function') throw new Error('updateOrder 함수를 찾지 못했습니다.');
      const originalConfirm = window.confirm;
      window.confirm = () => true;
      try {
        window.updateOrder();
      } finally {
        window.confirm = originalConfirm;
      }
      let clicked = await clickConfirmDialogsFast('save', 2200);
      if (!clicked) {
        await sleep(Math.min(CONFIG.saveDelay || 900, 500));
        clicked = await clickConfirmDialogs('save', 2);
      }
      await sleep(clicked ? 150 : Math.min(CONFIG.saveDelay || 900, 500));
      let holdVerification = null;
      if (rowResult.writeHold) {
        holdVerification = await verifyPersistedHold(rowResult);
      }
      let dbSync;
      try {
        dbSync = await syncManagementMemoDb(rowResult);
      } catch (error) {
        return {
          ...rowResult,
          popupOrderNo: popupTarget.orderNo,
          popupItemNo: popupTarget.itemNo,
          memo1InputBefore,
          memo1InputAfter,
          status: 'PARTIAL_FAIL',
          dbSync: 'FAIL',
          reason: (rowResult.reason || '') + ' / DB 관리메모 동기화 실패: ' + ((error && error.message) || error),
          log: '부분 실패: ' + rowResult.invNo + ' / 셀피아 저장 후 DB 메모 동기화 실패'
        };
      }
      return {
        ...rowResult,
        popupOrderNo: popupTarget.orderNo,
        popupItemNo: popupTarget.itemNo,
        memo1InputBefore,
        memo1InputAfter,
        holdVerification: holdVerification ? (holdVerification.expected + '=>' + holdVerification.actual) : '',
        dbSync: dbSync.status,
        status: rowResult.status,
        reason: rowResult.reason,
        log: '실행 완료: ' + rowResult.invNo + ' / 저장 완료' + (holdVerification ? ' / 배송보류 검증 ' + holdVerification.actual : '')
      };
    }

    async function inspectTask(task, options) {
      const addTaskResult = result => addResult(applyHoldCsvMeta(result, task));
      const addTaskPerfResult = (result, perf) => addResult(withPerf(applyHoldCsvMeta(result, task), perf));
      if (task.skip) {
        addTaskResult({
          invNo: task.invNo || '',
          ordNo: task.ordNo || '',
          itemNo: '',
        currentMemo1: '',
        plannedMemo1: '',
        currentMemo2: '',
        plannedMemo2: '',
        currentOrderMemo: '',
        plannedOrderMemo: '',
        currentHold: '',
        plannedHold: '',
        needsChange: 'N',
        status: 'SKIP',
        reason: task.reason,
        dbMatchStatus: task.dbMatchStatus || '',
        clearOffReason: '',
        actionSummary: 'skip',
        log: '건너뜀(SKIP): ' + (task.invNo || task.ordNo || '-') + ' / ' + task.reason
      });
        return;
      }
      const rows = rowsForTask(task);
      if (!rows.length) {
        addTaskResult({
          invNo: task.invNo || '',
          ordNo: task.ordNo || '',
          itemNo: '',
          currentMemo1: '',
          plannedMemo1: task.memo1,
          currentMemo2: '',
          plannedMemo2: task.memo2Map.size ? JSON.stringify(Object.fromEntries(task.memo2Map)) : '',
          currentOrderMemo: '',
          plannedOrderMemo: '',
          currentHold: '',
          plannedHold: task.writeHold ? systemShippingHoldForTask(task) : '',
          currentSellpiaHold: '',
          systemShippingHold: systemShippingHoldForTask(task),
          syncAction: 'REVIEW_SKIP',
          syncReason: holdSyncReason(task, 'REVIEW_SKIP'),
          needsChange: 'UNKNOWN',
          status: 'MATCH_FAIL',
          reason: failReason('현재 셀피아 재고매칭 목록에서 이 송장/주문의 상품행을 찾지 못했습니다.', task),
          dbMatchStatus: task.dbMatchStatus || '',
          clearOffReason: '',
          actionSummary: '그리드 행 없음',
          log: '매칭 실패(MATCH_FAIL): ' + (task.invNo || task.ordNo || '-') + ' / 그리드 행 없음'
        });
        return;
      }

      for (let i = 0; i < rows.length; i++) {
        const row = rows[i].item;
        const rowPerf = newPerf();
        if (canGridFastSkip(task, row)) {
          const current = gridCurrentValues(row);
          const plannedOrderMemo = plannedOrderMemoForGridRow(task, row, i, current.orderMemo);
          const fastSyncAction = holdSyncAction(current.hold, systemShippingHoldForTask(task), task);
          const policy = buildRowPolicyMeta(task, row, i, {
            currentOrderMemo: current.orderMemo,
            plannedOrderMemo,
            holdWriteRequested: task.writeHold,
            holdSyncAction: fastSyncAction
          });
          addTaskPerfResult({
            invNo: task.invNo || rowInvNo(row),
            ordNo: task.ordNo || rowOrdNo(row),
            itemNo: rowItemNo(row, i),
            itemNoForVerify: rowItemNoStrict(row) || rowItemNo(row, i),
            currentMemo1: current.memo1,
            plannedMemo1: '',
            currentMemo2: current.memo2,
            plannedMemo2: '',
            currentOrderMemo: current.orderMemo,
            plannedOrderMemo,
            currentOutboundScheduledDate: normal(current.outboundScheduledDate),
            plannedOutboundScheduledDate: normal(task.outboundScheduledDate),
            currentOutboundConfirmedDate: sellpiaDateValue(current.outboundConfirmedDate),
            plannedOutboundConfirmedDate: sellpiaDateValue(current.outboundConfirmedDate),
            currentHold: current.hold,
            plannedHold: task.writeHold ? systemShippingHoldForTask(task) : '',
            currentSellpiaHold: current.hold,
            systemShippingHold: systemShippingHoldForTask(task),
            syncAction: fastSyncAction,
            syncReason: holdSyncReason(task, fastSyncAction),
            needsChange: 'N',
            status: 'GRID_FAST_SKIP',
            reason: (task.reason || '') + ' / grid visible values already clear',
            dbMatchStatus: task.dbMatchStatus || '',
            clearOffReason: '',
            liveWriteAllowed: policy.liveWriteAllowed,
            currentStateWarning: policy.currentStateWarning,

          log: '현재값 매칭 실패: ' + (task.invNo || task.ordNo || '-')

    async function snapshotCurrentValues(invFilter, startDate, endDate) {
      results.length = 0;
