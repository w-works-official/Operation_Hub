      csvMode = 'snapshot';
      $('smu0707-log').textContent = '';
      $('smu0707-download').disabled = true;
      $('smu0707-issue-download').disabled = true;
      $('smu0707-stop').style.display = 'block';
      const range = invFilter ? targetRangeLabel(invFilter) : dateRange(startDate, endDate).label;
      $('smu0707-status').textContent = '현재값 확인 대상을 만드는 중...\n범위: ' + range;
      const tasks = await buildTasks(invFilter, startDate, endDate);
      const metaLines = buildMetaLines(tasks);
      $('smu0707-log').textContent += metaLines.join('\n') + '\n';
      $('smu0707-status').textContent = '현재값 확인 중: ' + tasks.length + '개 작업\n범위: ' + range + '\n' + metaLines.join('\n') + '\n저장 없음 / updateOrder 없음 / 보류 클릭 없음';
      for (let i = 0; i < tasks.length; i++) {

        const task = tasks[i];

      $('smu0707-stop').disabled = false;
      $('smu0707-stop').textContent = '중지';

    function koreanBlockReason(value) {
      const source = normal(value);
      if (!source) return '';
      if (BLOCK_REASON_KO[source]) return BLOCK_REASON_KO[source];
      let translated = source;
      for (const [code, label] of Object.entries(BLOCK_REASON_KO)) {
        translated = translated.replace(new RegExp('\\b' + code + '\\b', 'g'), label);
      }
      return translated
        .replace(/Sellpia grid row not found[^/]*/gi, '셀피아 재고매칭 목록에서 해당 상품행을 찾지 못함')
        .replace(/Sellpia detail popup did not open[^/]*/gi, '셀피아 상세 팝업을 열지 못함')
        .replace(/DB management memo sync failed/gi, 'DB 관리메모 동기화 실패')

    function isBlockedResultForPanel(result) {
      const r = result || {};

      if (r.needsChange === 'UNKNOWN') return true;
      return ['SKIP', 'MATCH_FAIL', 'DETAIL_FAIL', 'TEST_GUARD_FAIL', 'LIVE_BLOCKED', 'REVIEW_SKIP', 'WRITE_FAIL', 'PARTIAL_FAIL', 'CLOSE_FAIL'].includes(r.status);

    function blockedOrderGroups(rows = results) {
      const groups = new Map();
      for (const row of rows || []) {
        if (!isBlockedResultForPanel(row)) continue;
        const invNo = normal(row.invNo) || '-';
        const ordNo = normal(row.ordNo) || '-';
        const key = ordNo !== '-' ? 'ord:' + ordNo : 'inv:' + invNo;
        if (!groups.has(key)) groups.set(key, { invNo, ordNo, rowCount: 0, reasons: new Set() });
        const group = groups.get(key);
        group.rowCount++;
        if (group.invNo === '-' && invNo !== '-') group.invNo = invNo;
        const warnings = normal(row.currentStateWarning).split('/').map(normal).filter(Boolean);
        for (const warning of warnings) group.reasons.add(koreanBlockReason(warning));
        if (BLOCK_STATUS_KO[row.status]) group.reasons.add(BLOCK_STATUS_KO[row.status]);
        if (row.needsChange === 'UNKNOWN') group.reasons.add(BLOCK_STATUS_KO.UNKNOWN);
        if (normal(row.reason)) group.reasons.add(koreanBlockReason(row.reason));
        if (!group.reasons.size) group.reasons.add('안전조건을 충족하지 못해 실행하지 않음');
      }
      return [...groups.values()].map(group => ({ ...group, reasons: [...group.reasons].filter(Boolean) }));

          tasks = selectedBatch.tasks;
          lastBuildMeta = { ...(lastBuildMeta || {}), ...selectedBatch.meta };
          $('smu0707-log').textContent += '분할 실행 선택: 전체=' + selectedBatch.meta.batchTotalTargets + ', 선택=' + selectedBatch.meta.batchSelectedTargets + ', 배치=' + selectedBatch.meta.batchNo + '/' + selectedBatch.meta.batchTotal + ', 대상 순번=' + selectedBatch.meta.batchStart + '-' + selectedBatch.meta.batchEnd + ', 첫 대상=' + selectedBatch.meta.batchFirstTarget + ', 마지막 대상=' + selectedBatch.meta.batchLastTarget + '\n';
          if (!tasks.length) {
            alert('선택한 배치에 실행 대상이 없습니다.');
            return;
          }
        }
        const metaLines = buildMetaLines(tasks);
        $('smu0707-log').textContent += metaLines.join('\n') + '\n' + '작업 생성 시간=' + buildMs + 'ms\n';
        $('smu0707-status').textContent = (options.testMode ? '테스트 검사' : '실제 저장') + ' 중: ' + tasks.length + '개 작업\n범위: ' + range + '\n' + metaLines.join('\n') + '\n모드=' + (options.testMode ? '테스트(저장·클릭 없음)' : '실제 저장');
        for (let i = 0; i < tasks.length; i++) {
          if (stopped) break;
          const task = tasks[i];
          if (!options.doMemo1) task.writeMemo1 = false;
          if (!options.doMemo2) task.writeMemo2 = false;
          if (!options.doOrderMemo) task.writeOrderMemo = false;
          if (!options.doHold) task.writeHold = false;
          task.writeOutboundDates = options.doOutboundDates;
          const batchLine = lastBuildMeta && lastBuildMeta.batchEnabled
            ? '배치 ' + lastBuildMeta.batchNo + '/' + lastBuildMeta.batchTotal + ', 전체 대상 ' + (lastBuildMeta.batchStart + i) + '/' + lastBuildMeta.batchTotalTargets + '\n'
            : '';
          $('smu0707-status').textContent = '[' + (i + 1) + '/' + tasks.length + '] ' + (task.invNo || task.ordNo || '-') + '\n' + batchLine + task.reason;
          await inspectTask(task, options);
          await sleep(120);
        }
        const summary = summarizeResults();
        if (options.testMode) lastDryRunSummary = summary;
        $('smu0707-log').textContent += summary.lines.join('\n') + '\n' + '전체 실행 시간=' + perfMs(runStart) + 'ms\n';
        const doneTitle = options.testMode
          ? '테스트 완료: 셀피아와 DB를 변경하지 않았습니다.\n저장·클릭·updateOrder 없음\n'
          : (summary.blocking ? '실제 저장 일부 차단/실패\n' : '실제 저장 완료\n');
        const doneBatchLine = lastBuildMeta && lastBuildMeta.batchEnabled
          ? '배치 ' + lastBuildMeta.batchNo + '/' + lastBuildMeta.batchTotal + ', 대상 순번=' + lastBuildMeta.batchStart + '-' + lastBuildMeta.batchEnd + '/' + lastBuildMeta.batchTotalTargets + '\n'
          : '';
        $('smu0707-status').textContent = doneTitle + doneBatchLine + '결과 행: ' + results.length + '\n' + summary.lines.join('\n');
      } catch (err) {
        $('smu0707-status').textContent = '오류: ' + err.message;
        $('smu0707-log').textContent += (err.stack || err.message) + '\n';
      } finally {
        $('smu0707-stop').style.display = 'none';
      }
    }

    makeOverlay();
  })().catch(function(err){
    console.error('[0812-합배송오류수정]', err);
    alert('0812-합배송오류수정 오류: ' + (err && err.message ? err.message : err));
  });
})();
</script>

<script>
const SRC = document.getElementById('bookmarklet-source').textContent.trim();
document.getElementById('code-display').textContent = SRC;
document.getElementById('bookmarklet-link').href = 'javascript:' + encodeURIComponent(SRC);

  await navigator.clipboard.writeText(SRC);
  this.textContent = '복사 완료';
  setTimeout(() => { this.textContent = '코드 복사'; }, 1500);

</script>
